# Rollback: delete the GitHub release (if any) and tag, then revert the tagged
# commit on the default branch. Handles edge case where tag exists but
# release was never created (e.g. bump failed after push, before Create release).
# Prompts to yank on PyPI manually.
name: Rollback release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rollback (e.g. 1.0.0); its commit will be reverted"
        required: true
        type: string

permissions:
  contents: write
  packages: none

concurrency:
  group: release-operations
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback release and bump commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
          fetch-depth: 0

      - name: Validate tag
        id: validate
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "refs/tags/$TAG")
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Yank on PyPI (manual)
        run: |
          set -euo pipefail
          projects=(
            authweave-core
            litestar-auth
            authweave-workload
            authweave-otel
            authweave-webhooks
            authweave-http-signatures
          )
          for project in "${projects[@]}"; do
            echo "::notice title=PyPI Yank ($project)::Yank ${{ inputs.tag }} manually: https://pypi.org/manage/project/$project/releases/"
          done
          echo "Yank the version from every project before deleting the GitHub release/tag; follow docs/releasing.md."

      - name: Delete GitHub release and tag
        run: |
          TAG="${{ inputs.tag }}"
          if ! gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null; then
            git push origin --delete "$TAG" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert bump commit and push
        run: |
          set -e
          BRANCH="${{ github.event.repository.default_branch }}"
          TAG_SHA="${{ steps.validate.outputs.tag_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$TAG_SHA"
          git push origin "HEAD:$BRANCH"
