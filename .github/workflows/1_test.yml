name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "docker/**"
      - "docs/**"
      - "examples/**"
      - "litestar_auth/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "CHANGELOG.md"
      - "LICENSE"
      - "README.md"
      - "codecov.yml"
      - "justfile"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test job: id-token write is required for OIDC JWT (GitHub Actions OIDC reference).
# Codecov: use_oidc per codecov-action README; token alternative in Codecov token docs.
# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect
# https://github.com/codecov/codecov-action#using-oidc
# https://docs.codecov.com/docs/codecov-tokens

env:
  VENV_PRECOMMIT_CACHE_VERSION: v1

jobs:
  changes:
    name: Select verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request' && github.event.repository.fork == false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_IS_FORK" = "true" ]; then
            verify=false
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            verify=true
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            .gitignore \
            .pre-commit-config.yaml \
            .github/dependabot.yml \
            .github/workflows \
            docker \
            docs \
            examples \
            litestar_auth \
            packages \
            scripts \
            tests \
            CHANGELOG.md \
            LICENSE \
            README.md \
            codecov.yml \
            justfile \
            pyproject.toml \
            uv.lock \
            zensical.toml; then
            verify=false
          else
            verify=true
          fi
          echo "verify=$verify" >> "$GITHUB_OUTPUT"

  prek:
    needs: [changes]
    if: needs.changes.outputs.verify == 'true'
    name: Prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # Same as prek: skip hooks that are CI-inappropriate on default branch / shared runners.
      SKIP: detect-aws-credentials,no-commit-to-branch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set uv Python install dir
        run: echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python-dir" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Local hooks use `uv run` (language: system); cache .venv like the former prek job.
      # prek-action also caches the prek hook environment (default cache: true).
      # Key includes run_id + run_attempt so "Re-run jobs" does not try to save the same
      # cache key twice (GitHub: "another job may be creating this cache").
      # restore-keys restores any prior attempt for this OS/Python; uv sync fixes deps if needed.
      # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
      - name: Restore .venv cache (prek / uv run hooks)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-

      - name: Install the project
        run: uv sync --frozen --all-packages --all-extras --group dev

      - name: Save .venv cache (prek / uv run hooks)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-precommit-${{ env.VENV_PRECOMMIT_CACHE_VERSION }}-${{ runner.os }}-3.12-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          cache: true

  test:
    name: Test (${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [prek]
    runs-on: ${{ matrix.os }}
    if: github.event.repository.fork == false
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025-vs2026
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add .local/bin to Windows PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$USERPROFILE/.local/bin" >> "$GITHUB_PATH"

      - name: Clear Python install dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -rf "${UV_PYTHON_INSTALL_DIR:-}" 2>/dev/null || true

      - name: Set up Python
        shell: bash
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --frozen --all-packages --all-extras --group dev

      # Install the coverage subprocess startup hook so pytest-cov measures
      # import-time class/function definitions in modules that pytest-cov
      # imports during plugin discovery (otherwise instrumentation starts
      # after those modules are already in sys.modules).
      # See: https://coverage.readthedocs.io/en/latest/subprocess.html
      - name: Install coverage subprocess hook
        run: >-
          uv run python -c
          "import sysconfig, pathlib;
          p = pathlib.Path(sysconfig.get_paths()['purelib']) / 'coverage_subprocess.pth';
          p.write_text('import coverage; coverage.process_startup()\n');
          print(f'Installed {p}')"

      - name: Detect dead fixtures
        run: uv run pytest --dead-fixtures

      - name: Run tests (coverage + XML for Codecov)
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: >-
          uv run pytest
          --cov=litestar_auth
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
          --junitxml=test-results.junit.xml
          -o junit_family=legacy
          -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          flags: litestar-auth
          name: py-${{ matrix.python-version }}-${{ matrix.os }}
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: test-results.junit.xml
          flags: py-${{ matrix.python-version }}-${{ matrix.os }}
          name: py-${{ matrix.python-version }}-${{ matrix.os }}
          report_type: test_results
          use_oidc: true

  release-dry-run:
    name: Workspace release dry-run
    needs: [prek]
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test every release distribution
        env:
          RELEASE_DIST: ${{ runner.temp }}/release-dist
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --all-packages --all-extras --group dev
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$RELEASE_DIST"
          uv run --no-sync python scripts/release_artifacts.py smoke --dist-dir "$RELEASE_DIST"

  docs:
    name: Documentation build
    needs: [prek]
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install documentation dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: |
          mkdir -p site
          uv run zensical build --clean

  workspace-packages:
    name: ${{ matrix.package }} (${{ matrix.python-version }})
    needs: [prek]
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - authweave-core
          - authweave-workload
          - authweave-otel
          - authweave-webhooks
          - authweave-http-signatures
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test package
        shell: bash
        run: |
          uv sync --frozen --all-packages --all-extras --group dev
          package="${{ matrix.package }}"
          cd "packages/${package}"
          module="${package//-/_}"
          uv run --no-sync python -c "import pathlib, sysconfig; p = pathlib.Path(sysconfig.get_paths()['purelib']) / 'coverage_subprocess.pth'; p.write_text('import coverage; coverage.process_startup()\n')"
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check --preview .
          uv run --no-sync ty check "$module" tests
          uv run --no-sync deptry .
          COVERAGE_PROCESS_START=pyproject.toml uv run --no-sync pytest \
            --cov="$module" \
            --cov-branch \
            --cov-report=xml \
            --cov-fail-under=100 \
            --junitxml=test-results.junit.xml \
            -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          name: py-${{ matrix.python-version }}-ubuntu-${{ matrix.package }}
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/${{ matrix.package }}/test-results.junit.xml
          flags: py-${{ matrix.python-version }}-ubuntu-${{ matrix.package }}
          name: py-${{ matrix.python-version }}-ubuntu-${{ matrix.package }}
          report_type: test_results
          use_oidc: true

  docker-reference:
    name: Docker reference (Linux)
    needs: [prek]
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Machine Docker reference smoke
        run: sh docker/reference/verify.sh

      - name: SPIRE Workload API reference smoke
        run: sh docker/reference/spiffe/verify.sh

      - name: Observability Docker reference smoke
        run: sh docker/reference/observability/verify.sh

      - name: DPoP Redis Docker reference smoke
        run: sh docker/reference/dpop/verify.sh

      - name: Sender-constrained introspection Docker reference smoke
        run: sh docker/reference/introspection/verify.sh

      - name: Sender-constrained token exchange Docker reference smoke
        run: sh docker/reference/token-exchange/verify.sh

      - name: FAPI Message Signing Docker reference smoke
        run: sh docker/reference/fapi/verify.sh

      - name: HTTP signatures Redis Docker reference smoke
        run: sh docker/reference/http-signatures/verify.sh

      - name: Standard Webhooks Redis and non-Python reference smoke
        run: sh docker/reference/webhooks/verify.sh

  required-checks:
    name: Required checks
    needs: [changes, prek, test, release-dry-run, docs, workspace-packages, docker-reference]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY: ${{ needs.changes.outputs.verify }}
          PREK_RESULT: ${{ needs.prek.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_DRY_RUN_RESULT: ${{ needs.release-dry-run.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          WORKSPACE_PACKAGES_RESULT: ${{ needs.workspace-packages.result }}
          DOCKER_REFERENCE_RESULT: ${{ needs.docker-reference.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Verification scope selection did not succeed." >&2
            exit 1
          fi
          if [ "$VERIFY" != "true" ]; then
            echo "No changed path requires the full verification matrix."
            exit 0
          fi
          for result in \
            "$PREK_RESULT" \
            "$TEST_RESULT" \
            "$RELEASE_DRY_RUN_RESULT" \
            "$DOCS_RESULT" \
            "$WORKSPACE_PACKAGES_RESULT" \
            "$DOCKER_REFERENCE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required verification job concluded: $result" >&2
              exit 1
            fi
          done

  dispatch-release:
    name: Dispatch verified release
    needs: [required-checks]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && needs.required-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run release workflow for the tested tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TESTS_RUN_ID: ${{ github.run_id }}
        run: gh workflow run 3_release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tests_run_id="$TESTS_RUN_ID"
