name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  check-tag:
    name: Verify release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event.repository.fork == false && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      is_tag: ${{ steps.tag.outputs.is_tag }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify HEAD is tagged
        id: tag
        run: |
          T=$(git describe --tags --exact-match HEAD 2>/dev/null) || true
          if [ -n "$T" ]; then echo "is_tag=true" >> $GITHUB_OUTPUT; echo "tag=$T" >> $GITHUB_OUTPUT; else echo "is_tag=false" >> $GITHUB_OUTPUT; echo "tag=" >> $GITHUB_OUTPUT; fi

  reproducible-build:
    name: Reproducible build verification
    needs: [check-tag]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: First build (from lockfile)
        env:
          DIST1: ${{ runner.temp }}/dist1
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv build --package authweave-core --no-sources --out-dir "$DIST1/authweave-core"
          uv build --package litestar-auth --no-sources --out-dir "$DIST1/litestar-auth"
          uv build --package authweave-workload --no-sources --out-dir "$DIST1/authweave-workload"

      - name: Second build (same environment)
        env:
          DIST2: ${{ runner.temp }}/dist2
          SOURCE_DATE_EPOCH: "0"
        run: |
          rm -rf dist build src/*.egg-info *.egg-info 2>/dev/null || true
          uv sync --frozen --group dev --all-extras
          uv build --package authweave-core --no-sources --out-dir "$DIST2/authweave-core"
          uv build --package litestar-auth --no-sources --out-dir "$DIST2/litestar-auth"
          uv build --package authweave-workload --no-sources --out-dir "$DIST2/authweave-workload"

      - name: Compare distribution hashes
        env:
          DIST1: ${{ runner.temp }}/dist1
          DIST2: ${{ runner.temp }}/dist2
        run: |
          while IFS= read -r -d '' f; do
            name=${f#"$DIST1/"}
            h1=$(sha256sum "$DIST1/$name" | cut -d' ' -f1)
            h2=$(sha256sum "$DIST2/$name" | cut -d' ' -f1)
            if [ "$h1" != "$h2" ]; then
              echo "Hash mismatch for $name"
              exit 1
            fi
            echo "OK $name"
          done < <(find "$DIST1" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0)
          echo "Reproducible: distribution hashes match."

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist1/

  release-assets:
    name: Attach dist to GitHub Release
    needs: [check-tag, reproducible-build]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true
      - name: Attach wheel and sdist to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(dist/**/*.whl dist/**/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No wheel or sdist found under dist/"
            exit 1
          fi
          gh release upload "${{ needs.check-tag.outputs.tag }}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

  pypi-core:
    name: Publish authweave-core to PyPI
    needs: [check-tag, reproducible-build]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/p/authweave-core
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-core

  pypi-litestar:
    name: Publish litestar-auth to PyPI
    needs: [check-tag, reproducible-build]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litestar-auth
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/litestar-auth

  pypi-workload:
    name: Publish authweave-workload to PyPI
    needs: [check-tag, reproducible-build]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-workload
      url: https://pypi.org/p/authweave-workload
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-workload

  docs:
    name: Deploy documentation
    needs: [check-tag]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Default name "github-pages" duplicates across re-runs; deploy-pages then fails with
          # "Multiple artifacts named github-pages were unexpectedly found".
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
