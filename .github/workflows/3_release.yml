name: Release

# The first job accepts only a successful immutable-tag dispatch before any privileged step or
# untrusted checkout can execute; exact tag, protected-workflow provenance, and sole-draft checks follow.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Verify release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event.repository.fork == false && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    outputs:
      is_tag: ${{ steps.tag.outputs.is_tag }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify HEAD is tagged
        id: tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag --points-at HEAD)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "Expected exactly one tag on the tested commit, found: ${tags[*]}" >&2
            exit 1
          fi
          T="${tags[0]}"
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$T" != "$VERSION" ]; then
            echo "Tag $T does not match workspace version $VERSION" >&2
            exit 1
          fi
          if ! is_draft=$(gh release view "$T" --repo "$GH_REPO" --json isDraft --jq .isDraft); then
            echo "GitHub release $T is missing" >&2
            exit 1
          fi
          if [ "$is_draft" != "true" ]; then
            echo "GitHub release $T is not a draft" >&2
            exit 1
          fi
          bump_run_count=$(gh api \
            "repos/$GH_REPO/actions/workflows/2_bump.yml/runs?branch=$DEFAULT_BRANCH&event=workflow_dispatch&status=success&head_sha=$RELEASE_SHA&per_page=1" \
            --jq '.total_count')
          if [ "$bump_run_count" -lt 1 ]; then
            echo "No successful protected Tag prepared release run proves this exact commit" >&2
            exit 1
          fi
          draft_output=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft) | .tag_name')
          drafts=()
          if [ -n "$draft_output" ]; then
            mapfile -t drafts <<< "$draft_output"
          fi
          if [ "${#drafts[@]}" -ne 1 ] || [ "${drafts[0]}" != "$T" ]; then
            echo "Expected $T to be the repository's only draft release, found: ${drafts[*]}" >&2
            exit 1
          fi
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
          echo "tag=$T" >> "$GITHUB_OUTPUT"

  reproducible-build:
    name: Reproducible build verification
    needs: [check-tag]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: First build (from lockfile)
        env:
          DIST1: ${{ runner.temp }}/dist1
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST1"

      - name: Second build (same environment)
        env:
          DIST2: ${{ runner.temp }}/dist2
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST2"

      - name: Compare distribution hashes
        env:
          DIST1: ${{ runner.temp }}/dist1
          DIST2: ${{ runner.temp }}/dist2
        run: |
          uv run --no-sync python scripts/release_artifacts.py compare --first "$DIST1" --second "$DIST2"

      - name: Install and import built wheels
        env:
          DIST1: ${{ runner.temp }}/dist1
        run: uv run --no-sync python scripts/release_artifacts.py smoke --dist-dir "$DIST1"

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist1/

  release-assets:
    name: Attach dist to GitHub Release
    needs: [check-tag, reproducible-build]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true
      - name: Attach wheel and sdist to Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(dist/**/*.whl dist/**/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No wheel or sdist found under dist/"
            exit 1
          fi
          release_json=$(gh release view "$TAG" --repo "$GH_REPO" --json assets)
          while IFS= read -r remote_name; do
            found=false
            for asset in "${assets[@]}"; do
              if [ "${asset##*/}" = "$remote_name" ]; then
                found=true
                break
              fi
            done
            if [ "$found" != "true" ]; then
              echo "Unexpected existing release asset: $remote_name" >&2
              exit 1
            fi
          done < <(jq -r '.assets[].name' <<< "$release_json")

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            mapfile -t remote_digests < <(
              jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "")' <<< "$release_json"
            )
            if [ "${#remote_digests[@]}" -eq 0 ]; then
              gh release upload "$TAG" "$asset" --repo "$GH_REPO"
              continue
            fi
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            if [ "${#remote_digests[@]}" -ne 1 ] || [ "${remote_digests[0]}" != "$local_digest" ]; then
              echo "Release asset $name exists with a different or unavailable digest" >&2
              exit 1
            fi
            echo "Verified existing release asset: $name"
          done

  pypi-core:
    name: Publish authweave-core to PyPI
    needs: [check-tag, reproducible-build, release-assets]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/p/authweave-core
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-core

  pypi-litestar:
    name: Publish litestar-auth to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litestar-auth
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/litestar-auth

  pypi-workload:
    name: Publish authweave-workload to PyPI
    needs: [check-tag, reproducible-build, pypi-core, pypi-litestar]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-workload
      url: https://pypi.org/p/authweave-workload
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-workload

  pypi-otel:
    name: Publish authweave-otel to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-otel
      url: https://pypi.org/p/authweave-otel
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-otel

  pypi-webhooks:
    name: Publish authweave-webhooks to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-webhooks
      url: https://pypi.org/p/authweave-webhooks
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-webhooks

  pypi-http-signatures:
    name: Publish authweave-http-signatures to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-http-signatures
      url: https://pypi.org/p/authweave-http-signatures
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-http-signatures

  docs:
    name: Deploy documentation
    needs:
      - check-tag
      - pypi-core
      - pypi-litestar
      - pypi-workload
      - pypi-otel
      - pypi-webhooks
      - pypi-http-signatures
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Default name "github-pages" duplicates across re-runs; deploy-pages then fails with
          # "Multiple artifacts named github-pages were unexpectedly found".
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  publish-release:
    name: Publish GitHub Release
    needs:
      - check-tag
      - release-assets
      - pypi-core
      - pypi-litestar
      - pypi-workload
      - pypi-otel
      - pypi-webhooks
      - pypi-http-signatures
      - docs
    if: success() && needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
