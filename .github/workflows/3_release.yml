name: Release

# Tests dispatch this workflow on the exact immutable version tag. The first job independently
# requires successful Tests and protected bump runs for that SHA before any privileged job starts.
on:
  workflow_dispatch:
    inputs:
      tests_run_id:
        description: Successful tag-bound Tests workflow run ID
        required: true
        type: string

permissions: {}

env:
  # Share the tested content-addressed uv/Python cache across release-only lock changes.
  UV_CACHE_VERSION: v1

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Verify release trigger
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      # GitHub exposes draft releases only to tokens with push access.
      contents: write
    outputs:
      is_tag: ${{ steps.tag.outputs.is_tag }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify HEAD is tagged
        id: tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          TESTS_RUN_ID: ${{ inputs.tests_run_id }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "Release must be dispatched on an immutable tag, got $RELEASE_REF" >&2
            exit 1
          fi
          if [[ ! "$TESTS_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Tests run ID must be numeric" >&2
            exit 1
          fi
          mapfile -t tags < <(git tag --points-at HEAD)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "Release commit has no tag" >&2
            exit 1
          fi
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "Expected exactly one tag on the tested commit, found: ${tags[*]}" >&2
            exit 1
          fi
          T="${tags[0]}"
          if [ "$RELEASE_REF" != "refs/tags/$T" ]; then
            echo "Release ref $RELEASE_REF does not match tag $T" >&2
            exit 1
          fi
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$T" != "$VERSION" ]; then
            echo "Tag $T does not match workspace version $VERSION" >&2
            exit 1
          fi
          if ! is_draft=$(gh release view "$T" --repo "$GH_REPO" --json isDraft --jq .isDraft); then
            echo "GitHub release $T is missing" >&2
            exit 1
          fi
          if [ "$is_draft" != "true" ]; then
            echo "GitHub release $T is not a draft" >&2
            exit 1
          fi
          bump_run_count=$(gh api \
            "repos/$GH_REPO/actions/workflows/2_bump.yml/runs?branch=$DEFAULT_BRANCH&event=workflow_dispatch&status=success&head_sha=$RELEASE_SHA&per_page=1" \
            --jq '.total_count')
          if [ "$bump_run_count" -lt 1 ]; then
            echo "No successful protected Tag prepared release run proves this exact commit" >&2
            exit 1
          fi
          tests_workflow_id=$(gh api "repos/$GH_REPO/actions/workflows/1_test.yml" --jq .id)
          test_run=
          for _ in {1..12}; do
            test_run=$(gh api "repos/$GH_REPO/actions/runs/$TESTS_RUN_ID")
            if [ "$(jq -r .status <<< "$test_run")" = "completed" ]; then
              break
            fi
            sleep 5
          done
          if ! jq -e \
            --arg sha "$RELEASE_SHA" \
            --arg tag "$T" \
            --argjson workflow_id "$tests_workflow_id" \
            '.status == "completed" and
             .conclusion == "success" and
             .event == "workflow_dispatch" and
             .head_sha == $sha and
             .head_branch == $tag and
             .workflow_id == $workflow_id' \
            <<< "$test_run" >/dev/null; then
            echo "Tests run $TESTS_RUN_ID does not prove this exact tagged commit" >&2
            exit 1
          fi
          draft_output=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft) | .tag_name')
          drafts=()
          if [ -n "$draft_output" ]; then
            mapfile -t drafts <<< "$draft_output"
          fi
          if [ "${#drafts[@]}" -ne 1 ] || [ "${drafts[0]}" != "$T" ]; then
            echo "Expected $T to be the repository's only draft release, found: ${drafts[*]}" >&2
            exit 1
          fi
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
          echo "tag=$T" >> "$GITHUB_OUTPUT"

  reproducible-build:
    name: Reproducible build verification
    needs: [check-tag]
    timeout-minutes: 10
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ${{ env.UV_CACHE_VERSION }}
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: First build (from lockfile)
        env:
          DIST1: ${{ runner.temp }}/dist1
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST1"

      - name: Second build (same environment)
        env:
          DIST2: ${{ runner.temp }}/dist2
          SOURCE_DATE_EPOCH: "0"
        run: |
          uv sync --frozen --group dev --all-extras
          uv run --no-sync python scripts/release_artifacts.py build --dist-dir "$DIST2"

      - name: Compare distribution hashes
        env:
          DIST1: ${{ runner.temp }}/dist1
          DIST2: ${{ runner.temp }}/dist2
        run: |
          uv run --no-sync python scripts/release_artifacts.py compare --first "$DIST1" --second "$DIST2"

      - name: Install and import built wheels
        env:
          DIST1: ${{ runner.temp }}/dist1
        run: uv run --no-sync python scripts/release_artifacts.py smoke --dist-dir "$DIST1"

      - name: Generate distribution SBOMs
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom
          SBOM_CHECK_DIR: ${{ runner.temp }}/sbom-check
        run: |
          set -euo pipefail
          mkdir -p "$SBOM_DIR" "$SBOM_CHECK_DIR"
          VERSION=$(uv run --no-sync python scripts/release_artifacts.py version)
          RELEASE_TIMESTAMP=$(git show -s --format=%cI "$GITHUB_SHA")
          packages=(
            authweave-core
            litestar-auth
            authweave-workload
            authweave-otel
            authweave-webhooks
            authweave-http-signatures
          )
          for output_dir in "$SBOM_DIR" "$SBOM_CHECK_DIR"; do
            for package in "${packages[@]}"; do
              raw=$(mktemp)
              uv export --preview-features sbom-export --frozen \
                --package "$package" \
                --all-extras \
                --no-default-groups \
                --format cyclonedx1.5 \
                --output-file "$raw"
              serial_number=$(uv run --no-sync python -c \
                'import sys; from uuid import NAMESPACE_URL, uuid5; print(f"urn:uuid:{uuid5(NAMESPACE_URL, sys.argv[1])}")' \
                "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION#$package")
              jq -cS \
                --arg serial_number "$serial_number" \
                --arg timestamp "$RELEASE_TIMESTAMP" \
                '."$schema" = "https://cyclonedx.org/schema/bom-1.7.schema.json" |
                 .specVersion = "1.7" |
                 .serialNumber = $serial_number |
                 .metadata.timestamp = $timestamp' \
                "$raw" \
                > "$output_dir/$package-$VERSION.cdx.json"
              jq -e \
                --arg package "$package" \
                --arg version "$VERSION" \
                '.bomFormat == "CycloneDX" and
                 .specVersion == "1.7" and
                 .metadata.component.name == $package and
                 .metadata.component.version == $version' \
                "$output_dir/$package-$VERSION.cdx.json" >/dev/null
            done
          done
          for package in "${packages[@]}"; do
            cmp \
              "$SBOM_DIR/$package-$VERSION.cdx.json" \
              "$SBOM_CHECK_DIR/$package-$VERSION.cdx.json"
          done

      - name: Attest distribution build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/**/*.whl
            ${{ runner.temp }}/dist1/**/*.tar.gz

      - name: Attest authweave-core SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/authweave-core/*.whl
            ${{ runner.temp }}/dist1/authweave-core/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/authweave-core-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Attest litestar-auth SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/litestar-auth/*.whl
            ${{ runner.temp }}/dist1/litestar-auth/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/litestar-auth-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Attest authweave-workload SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/authweave-workload/*.whl
            ${{ runner.temp }}/dist1/authweave-workload/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/authweave-workload-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Attest authweave-otel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/authweave-otel/*.whl
            ${{ runner.temp }}/dist1/authweave-otel/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/authweave-otel-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Attest authweave-webhooks SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/authweave-webhooks/*.whl
            ${{ runner.temp }}/dist1/authweave-webhooks/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/authweave-webhooks-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Attest authweave-http-signatures SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist1/authweave-http-signatures/*.whl
            ${{ runner.temp }}/dist1/authweave-http-signatures/*.tar.gz
          sbom-path: ${{ runner.temp }}/sbom/authweave-http-signatures-${{ needs.check-tag.outputs.tag }}.cdx.json

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist1/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/

  release-assets:
    name: Attach dist to GitHub Release
    needs: [check-tag, reproducible-build]
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
          merge-multiple: true
      - name: Attach distributions and SBOMs to Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(dist/**/*.whl dist/**/*.tar.gz sbom/*.cdx.json)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          release_json=$(gh release view "$TAG" --repo "$GH_REPO" --json assets)
          while IFS= read -r remote_name; do
            found=false
            for asset in "${assets[@]}"; do
              if [ "${asset##*/}" = "$remote_name" ]; then
                found=true
                break
              fi
            done
            if [ "$found" != "true" ]; then
              echo "Unexpected existing release asset: $remote_name" >&2
              exit 1
            fi
          done < <(jq -r '.assets[].name' <<< "$release_json")

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            mapfile -t remote_digests < <(
              jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "")' <<< "$release_json"
            )
            if [ "${#remote_digests[@]}" -eq 0 ]; then
              gh release upload "$TAG" "$asset" --repo "$GH_REPO"
              continue
            fi
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            if [ "${#remote_digests[@]}" -ne 1 ] || [ "${remote_digests[0]}" != "$local_digest" ]; then
              echo "Release asset $name exists with a different or unavailable digest" >&2
              exit 1
            fi
            echo "Verified existing release asset: $name"
          done

  pypi-core:
    name: Publish authweave-core to PyPI
    needs: [check-tag, reproducible-build, release-assets]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/p/authweave-core
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-core

  pypi-litestar:
    name: Publish litestar-auth to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litestar-auth
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/litestar-auth

  pypi-workload:
    name: Publish authweave-workload to PyPI
    needs: [check-tag, reproducible-build, pypi-core, pypi-litestar]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-workload
      url: https://pypi.org/p/authweave-workload
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-workload

  pypi-otel:
    name: Publish authweave-otel to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-otel
      url: https://pypi.org/p/authweave-otel
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-otel

  pypi-webhooks:
    name: Publish authweave-webhooks to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-webhooks
      url: https://pypi.org/p/authweave-webhooks
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-webhooks

  pypi-http-signatures:
    name: Publish authweave-http-signatures to PyPI
    needs: [check-tag, reproducible-build, pypi-core]
    timeout-minutes: 5
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-http-signatures
      url: https://pypi.org/p/authweave-http-signatures
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/authweave-http-signatures

  docs:
    name: Deploy documentation
    needs:
      - check-tag
      - pypi-core
      - pypi-litestar
      - pypi-workload
      - pypi-otel
      - pypi-webhooks
      - pypi-http-signatures
    if: needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ${{ env.UV_CACHE_VERSION }}
          prune-cache: true
          cache-python: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: |
          mkdir -p site
          uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # Default name "github-pages" duplicates across re-runs; deploy-pages then fails with
          # "Multiple artifacts named github-pages were unexpectedly found".
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  publish-release:
    name: Publish GitHub Release
    needs:
      - check-tag
      - release-assets
      - pypi-core
      - pypi-litestar
      - pypi-workload
      - pypi-otel
      - pypi-webhooks
      - pypi-http-signatures
      - docs
    if: success() && needs.check-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
