name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues and avoid including secrets or credentials.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: litestar-auth 7.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.13, Litestar 2.x, operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable example and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's Code of Conduct.
          required: true
