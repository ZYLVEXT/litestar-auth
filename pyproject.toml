[project]
name = "litestar-auth"
version = "7.1.1"
description = "Opaque human sessions for Litestar on the AuthWeave authentication stack"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vladislav Shepilov", email = "shepilov.v@protonmail.com"},
]
maintainers = [
    {name = "Vladislav Shepilov", email = "shepilov.v@protonmail.com"},
]
keywords = [
    "library", "litestar", "auth", "authentication", "authorization", "jwt", "database", "redis", "oauth", "httpx-oauth",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = "<3.15.0,>=3.12.0"
dependencies = [
    "anyio>=4.14.2,<5.0",
    "authweave-core==7.1.1",
    "litestar>=2.24.0,<3.0",
    "advanced-alchemy>=1.11.0,<2.0",
    "idna>=3.18,<4.0",
    "pwdlib[argon2]>=0.3.0,<0.4.0",
    "pyjwt>=2.13.0,<3.0",
]

[project.urls]
homepage = "https://github.com/ZYLVEXT/litestar-auth"
documentation = "https://zylvext.github.io/litestar-auth/"
source = "https://github.com/ZYLVEXT/litestar-auth"
tracker = "https://github.com/ZYLVEXT/litestar-auth/issues"

[project.optional-dependencies]
redis = ["redis>=8.1.0,<9.0"]
oauth = ["httpx>=0.28.1,<1.0", "httpx-oauth>=0.17.0,<0.18.0", "cryptography>=50.0.0,<51.0"]
totp = ["cryptography>=50.0.0,<51.0"]
jwt = ["cryptography>=50.0.0,<51.0"]
all = ["litestar-auth[redis,oauth,totp,jwt]"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<0.23",
    "commitizen>=4.17.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-deadfixtures>=3.1.0",
    "python-dotenv>=1.2.2",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3,<7.0",
    "ruff>=0.16.1",
    "rust-just>=1.57.0",
    "ty>=0.0.65",
    "deptry>=0.25.1",
    "prek>=0.4.11",
    "fakeredis[lua]>=2.37.0",
]
docs = [
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
    "zensical>=0.0.52",
]
reference = [
    "asyncpg>=0.31.0,<0.32",
    "authweave-http-signatures[redis]==7.1.1",
    "authweave-otel==7.1.1",
    "authweave-webhooks[redis]==7.1.1",
    "authweave-workload[all]==7.1.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2.0",
    "opentelemetry-sdk>=1.44.0,<2.0",
    "uvicorn>=0.52.1,<0.53",
]

[tool.ty.environment]
# Match project.requires-python minimum for type-checking.
python-version = "3.12"

[tool.ty.src]
# Type-check the library and tests only (exclude docs snippets and tooling).
include = ["litestar_auth", "tests"]

[tool.deptry]
experimental_namespace_package = true
exclude = [".uv-cache", ".venv", "dist", "docker", "docs/vectors", "examples", "packages", "site", "tests"]

[tool.deptry.per_rule_ignores]
DEP001 = ["uvicorn"]
DEP004 = ["dotenv", "yaml"]
DEP002 = ["redis", "httpx-oauth", "litestar-auth", "cryptography"]
DEP003 = ["msgspec", "sqlalchemy"]

[tool.uv]
default-groups = []

[tool.uv.sources]
authweave-core = {workspace = true}
authweave-http-signatures = {workspace = true}
authweave-otel = {workspace = true}
authweave-webhooks = {workspace = true}
authweave-workload = {workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
# Assume Python 3.12 to be compatible with typing.
target-version = "py312"
preview = true
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    "ralph_helpers.py",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "line-too-long",  # handled by ruff-format
    "missing-trailing-comma",  # conflicts with ruff-format
    "missing-copyright-notice",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_fapi.py" = ["unused-async"]
"docker/reference/*.py" = [
    "assert",
    "builtin-argument-shadowing",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-func-arg",
    "import-outside-top-level",
    "no-self-use",
    "pytest-composite-assertion",
    "try-consider-else",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unused-method-argument",
]
"docker/reference/**/*.py" = [
