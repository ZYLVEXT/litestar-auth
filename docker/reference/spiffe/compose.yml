services:
  server:
    image: ghcr.io/spiffe/spire-server:1.15.0@sha256:734433bd91b676acf1f8b5651c0e40028cab9381830db1ce364d91cfb27dec9c
    user: "0:0"
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./server.conf:/run/spire/config/server.conf:ro
      - server-socket:/run/spire/sockets

  agent:
    image: ghcr.io/spiffe/spire-agent:1.15.0@sha256:cdf98ba3c8cbbfadef9e996bb70844eccc9a6ecaf2aca506430b08113aa68acd
    user: "0:0"
    command:
      - -config
      - /run/spire/config/agent.conf
      - -joinToken
      - ${SPIRE_JOIN_TOKEN:-unused}
    depends_on:
      - server
    pid: host
    volumes:
      - ./agent.conf:/run/spire/config/agent.conf:ro
      - agent-socket:/run/spire/sockets

  verifier:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim@sha256:7cf77f594be8042dab6daa9fe326f90962252268b4f120a7f5dccce4d947e6c1
    command:
      - uv
      - run
      - --project
      - /workspace/packages/authweave-workload
      - --extra
      - spiffe
      - python
      - /run/reference/verify_spire.py
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    volumes:
      - ../../..:/workspace:ro
      - ./verify_spire.py:/run/reference/verify_spire.py:ro
      - agent-socket:/run/spire/sockets

volumes:
  agent-socket:
  server-socket:
