services:
  server:
    image: ghcr.io/spiffe/spire-server:1.15.2@sha256:aa74ef1be86bc8e0684007d84a4d9859d294384d842c30425048d73429f3216e
    user: "0:0"
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./server.conf:/run/spire/config/server.conf:ro
      - server-socket:/run/spire/sockets

  agent:
    image: ghcr.io/spiffe/spire-agent:1.15.2@sha256:1d042e4040466686e0ee46f74981ff2167c86adfadca19b3835946f4d6047536
    user: "0:0"
    command:
      - -config
      - /run/spire/config/agent.conf
      - -joinToken
      - ${SPIRE_JOIN_TOKEN:-unused}
    depends_on:
      - server
    pid: host
    volumes:
      - ./agent.conf:/run/spire/config/agent.conf:ro
      - agent-socket:/run/spire/sockets

  verifier:
    image: ghcr.io/astral-sh/uv:0.12.2-python3.14-trixie-slim@sha256:d6e6a4de8d48bb4e64bcc2e2bd1e2291fb00ee4fd07a5dcfdc4c621afddcfe75
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - python
      - /run/reference/verify_spire.py
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    volumes:
      - ../../..:/workspace:ro
      - ./verify_spire.py:/run/reference/verify_spire.py:ro
      - agent-socket:/run/spire/sockets

volumes:
  agent-socket:
  server-socket:
