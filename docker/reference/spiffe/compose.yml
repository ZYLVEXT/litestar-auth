services:
  server:
    image: ghcr.io/spiffe/spire-server:1.15.3@sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
    user: "0:0"
    command: ["-config", "/run/spire/config/server.conf"]
    volumes:
      - ./server.conf:/run/spire/config/server.conf:ro
      - server-socket:/run/spire/sockets

  agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3@sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
    user: "0:0"
    command:
      - -config
      - /run/spire/config/agent.conf
      - -joinToken
      - ${SPIRE_JOIN_TOKEN:-unused}
    depends_on:
      - server
    pid: host
    volumes:
      - ./agent.conf:/run/spire/config/agent.conf:ro
      - agent-socket:/run/spire/sockets

  verifier:
    image: ghcr.io/astral-sh/uv:0.12.7-python3.14-trixie-slim@sha256:0e664b12a6be9cd16be1015ec5cc3feebdeb42078ab587389707afbdfab8b10f
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - python
      - /run/reference/verify_spire.py
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    volumes:
      - ../../..:/workspace:ro
      - ./verify_spire.py:/run/reference/verify_spire.py:ro
      - agent-socket:/run/spire/sockets

volumes:
  agent-socket:
  server-socket:
