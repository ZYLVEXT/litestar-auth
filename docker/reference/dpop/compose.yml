# DPoP resource-server Docker reference (no client certificate)
#
# External test AS/JWKS + Redis-backed multi-worker RS for authweave-workload[dpop].
# Direct mTLS live harness remains docker/reference/verify.sh.

services:
  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  test-authorization-server:
    image: ghcr.io/astral-sh/uv:0.12.2-python3.14-trixie-slim@sha256:d6e6a4de8d48bb4e64bcc2e2bd1e2291fb00ee4fd07a5dcfdc4c621afddcfe75
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - uvicorn
      - test_authorization_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --log-level
      - warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/as-venv
      AS_ISSUER: https://as.example
      AS_AUDIENCE: payments-api
      AS_TOKEN_TARGET: https://as.example/oauth/token
    ports:
      - "127.0.0.1:18082:8082"
    volumes:
      - ../../..:/workspace:ro
      - ./test_authorization_server.py:/app/test_authorization_server.py:ro
    working_dir: /app
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8082),2); s.close()"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

  upstream:
    image: ghcr.io/astral-sh/uv:0.12.2-python3.14-trixie-slim@sha256:d6e6a4de8d48bb4e64bcc2e2bd1e2291fb00ee4fd07a5dcfdc4c621afddcfe75
    depends_on:
      redis:
        condition: service_healthy
      test-authorization-server:
        condition: service_healthy
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - uvicorn
      - upstream_dpop:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "4"
      - --log-level
      - warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/upstream-venv
      REDIS_URL: redis://redis:6379/0
      AS_INTERNAL_JWKS_URL: http://test-authorization-server:8082/.well-known/jwks.json
      AS_ISSUER: https://as.example
      AS_AUDIENCE: payments-api
      EXTERNAL_TARGET: https://api.example/v1/payments
      UPSTREAM_HOST: 0.0.0.0
      UPSTREAM_PORT: "8080"
    ports:
      - "127.0.0.1:18081:8080"
    working_dir: /app
    volumes:
      - ../../..:/workspace:ro
      - ./upstream_dpop.py:/app/upstream_dpop.py:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s
