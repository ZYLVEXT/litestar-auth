x-sts-build: &sts-build
  build:
    context: ../../..
    dockerfile: docker/reference/token-exchange/Dockerfile

services:
  certificates:
    image: alpine/openssl:3.5.8@sha256:61cec9c1f221755bf995f1f309211b222164599e2d1943b666f878ef644d3a0e
    entrypoint: ["/bin/sh"]
    command: ["/app/generate-pki.sh"]
    volumes:
      - certificates:/certs
      - ./client.ext:/app/client.ext:ro
      - ./generate-pki.sh:/app/generate-pki.sh:ro
      - ./server.ext:/app/server.ext:ro

  token-exchange:
    <<: *sts-build
    depends_on:
      certificates:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --no-sync
      - --project
      - /workspace
      - uvicorn
      - authorization_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /certs/server.key
      - --ssl-certfile
      - /certs/server.crt
      - --log-level
      - warning
    ports:
      - "127.0.0.1:18444:8443"
    volumes:
      - ../../..:/workspace:ro
      - ./authorization_server.py:/app/authorization_server.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

  token-exchange-mtls:
    <<: *sts-build
    depends_on:
      certificates:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --no-sync
      - --project
      - /workspace
      - uvicorn
      - authorization_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /certs/server.key
      - --ssl-certfile
      - /certs/server.crt
      - --ssl-ca-certs
      - /certs/ca.crt
      - --ssl-cert-reqs
      - "2"
      - --log-level
      - warning
    ports:
      - "127.0.0.1:18445:8443"
    volumes:
      - ../../..:/workspace:ro
      - ./authorization_server.py:/app/authorization_server.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

volumes:
  certificates:
