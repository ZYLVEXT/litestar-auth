name: litestar-auth-v7-reference

services:
  pki:
    image: alpine/openssl:3.5.7@sha256:0a0b910a215ef38890e24526795f11d92c6f1016682fc4ef37fc5c44e23b758f
    entrypoint: ["/bin/sh"]
    command: ["/config/generate-pki.sh"]
    volumes:
      - pki-state:/state
      - pki-public:/public
      - pki-envoy:/envoy
      - pki-clients:/clients
      - .:/config:ro

  curl:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    profiles: ["tools"]
    user: "0:0"
    volumes:
      - pki-public:/public:ro
      - pki-clients:/clients:ro

  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_USER: auth
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  upstream:
    image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim@sha256:dfe4069fefc02ee4d6097c26f31d0784df09c9b6242fb4a25ad31fbae74ec6aa
    depends_on:
      pki: {condition: service_completed_successfully}
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - python
      - /app/upstream.py
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/upstream-venv
    volumes:
      - ../..:/workspace:ro
      - pki-public:/pki:ro
      - shared:/shared
      - ./upstream.py:/app/upstream.py:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /shared/upstream.sock"]
      interval: 1s
      timeout: 3s
      retries: 60

  envoy:
    image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
    depends_on:
      pki: {condition: service_completed_successfully}
      upstream: {condition: service_started}
    ports: ["127.0.0.1:15443:8443", "127.0.0.1:19901:9901"]
    volumes:
      - pki-public:/pki/public:ro
      - pki-envoy:/pki/envoy:ro
      - shared:/shared
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro

  jwks:
    image: python:3.14.6-alpine@sha256:26730869004e2b9c4b9ad09cab8625e81d256d1ce97e72df5520e806b1709f92
    command: ["python", "/app/jwks.py"]
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./jwks.py:/app/jwks.py:ro

volumes:
  pki-state:
  pki-public:
  pki-envoy:
  pki-clients:
  shared:
