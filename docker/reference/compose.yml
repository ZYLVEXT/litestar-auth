name: litestar-auth-v7-reference

services:
  pki:
    image: alpine/openssl:3.5.7@sha256:0a0b910a215ef38890e24526795f11d92c6f1016682fc4ef37fc5c44e23b758f
    entrypoint: ["/bin/sh"]
    command: ["/config/generate-pki.sh"]
    volumes:
      - pki-state:/state
      - pki-public:/public
      - pki-envoy:/envoy
      - pki-clients:/clients
      - .:/config:ro

  curl:
    image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    profiles: ["tools"]
    user: "0:0"
    volumes:
      - pki-public:/public:ro
      - pki-clients:/clients:ro

  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_USER: auth
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  upstream:
    image: ghcr.io/astral-sh/uv:0.12.2-python3.14-trixie-slim@sha256:d6e6a4de8d48bb4e64bcc2e2bd1e2291fb00ee4fd07a5dcfdc4c621afddcfe75
    depends_on:
      pki: {condition: service_completed_successfully}
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - python
      - /app/upstream.py
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/upstream-venv
    volumes:
      - ../..:/workspace:ro
      - pki-public:/pki:ro
      - shared:/shared
      - ./upstream.py:/app/upstream.py:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /shared/upstream.sock"]
      interval: 1s
      timeout: 3s
      retries: 60

  envoy:
    image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
    depends_on:
      pki: {condition: service_completed_successfully}
      upstream: {condition: service_started}
    ports: ["127.0.0.1:15443:8443", "127.0.0.1:19901:9901"]
    volumes:
      - pki-public:/pki/public:ro
      - pki-envoy:/pki/envoy:ro
      - shared:/shared
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro

  jwks:
    image: python:3.14.7-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
    command: ["python", "/app/jwks.py"]
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./jwks.py:/app/jwks.py:ro

volumes:
  pki-state:
  pki-public:
  pki-envoy:
  pki-clients:
  shared:
