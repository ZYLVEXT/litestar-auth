services:
  certificates:
    image: alpine/openssl:3.5.7@sha256:0a0b910a215ef38890e24526795f11d92c6f1016682fc4ef37fc5c44e23b758f
    command:
      - req
      - -x509
      - -newkey
      - ec
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -nodes
      - -days
      - "1"
      - -subj
      - /CN=authorization-server
      - -addext
      - subjectAltName=DNS:authorization-server,IP:127.0.0.1
      - -keyout
      - /certs/server.key
      - -out
      - /certs/server.crt
    volumes:
      - certificates:/certs

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  authorization-server:
    image: ghcr.io/astral-sh/uv:0.12.5-python3.14-trixie-slim@sha256:dc360d7e5f968c682e8b59e83027a315a0232dead15cb9dfe3e707a12ba390e1
    depends_on:
      certificates:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - uvicorn
      - authorization_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /certs/server.key
      - --ssl-certfile
      - /certs/server.crt
      - --log-level
      - warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/as-venv
    ports:
      - "127.0.0.1:18443:8443"
    volumes:
      - ../../..:/workspace:ro
      - ./authorization_server.py:/app/authorization_server.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

  resource-server:
    image: ghcr.io/astral-sh/uv:0.12.5-python3.14-trixie-slim@sha256:dc360d7e5f968c682e8b59e83027a315a0232dead15cb9dfe3e707a12ba390e1
    depends_on:
      authorization-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - uvicorn
      - resource_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "4"
      - --log-level
      - warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/rs-venv
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - ../../..:/workspace:ro
      - ./resource_server.py:/app/resource_server.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

volumes:
  certificates:
