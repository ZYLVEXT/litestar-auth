apiVersion: 1

datasources:
  - name: Prometheus
    uid: authweave-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: authweave-tempo

  - name: Tempo
    uid: authweave-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: authweave-prometheus
      serviceMap:
        datasourceUid: authweave-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
