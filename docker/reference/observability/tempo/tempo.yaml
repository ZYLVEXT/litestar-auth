server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 20
      queue_depth: 1000

overrides:
  defaults:
    compaction:
      block_retention: 1h
    metrics_generator:
      processors: []

querier:
  max_concurrent_queries: 5

query_frontend:
  max_retries: 2
