services:
  certificates:
    image: alpine/openssl:3.5.7@sha256:0a0b910a215ef38890e24526795f11d92c6f1016682fc4ef37fc5c44e23b758f
    command:
      - req
      - -x509
      - -newkey
      - ec
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -nodes
      - -days
      - "1"
      - -subj
      - /CN=fapi-authorization-server
      - -addext
      - subjectAltName=DNS:fapi-authorization-server,IP:127.0.0.1
      - -keyout
      - /certs/server.key
      - -out
      - /certs/server.crt
    volumes:
      - certificates:/certs

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  fapi-authorization-server:
    image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim@sha256:dfe4069fefc02ee4d6097c26f31d0784df09c9b6242fb4a25ad31fbae74ec6aa
    depends_on:
      certificates:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --frozen
      - --project
      - /workspace
      - --group
      - reference
      - uvicorn
      - authorization_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-keyfile
      - /certs/server.key
      - --ssl-certfile
      - /certs/server.crt
      - --log-level
      - warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/as-venv
    ports:
      - "127.0.0.1:18444:8443"
    volumes:
      - ../../..:/workspace:ro
      - ./authorization_server.py:/app/authorization_server.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8443),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

  resource-server:
    image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim@sha256:dfe4069fefc02ee4d6097c26f31d0784df09c9b6242fb4a25ad31fbae74ec6aa
    depends_on:
      fapi-authorization-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        uv run --frozen --project /workspace --group reference
        env SSL_CERT_FILE=/certs/server.crt
        uvicorn upstream_dpop:app --host 0.0.0.0 --port 8080 --workers 4 --log-level warning
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/rs-venv
      REDIS_URL: redis://redis:6379/0
      AS_INTERNAL_JWKS_URL: https://fapi-authorization-server:8443/.well-known/jwks.json
      AS_ISSUER: https://fapi-as.example
      AS_AUDIENCE: payments-api
      EXTERNAL_TARGET: https://api.example/v1/payments
      PAYMENT_AUTHORIZATION_DETAILS: "1"
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - ../../..:/workspace:ro
      - ../dpop/upstream_dpop.py:/app/upstream_dpop.py:ro
      - certificates:/certs:ro
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 25s

volumes:
  certificates:
