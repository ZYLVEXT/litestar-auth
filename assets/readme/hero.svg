<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">litestar-auth 7 authentication stack</title>
  <desc id="desc">
    Human requests follow an opaque session path through litestar-auth. Machine requests follow
    a certificate-bound path through authweave-workload. Both use authweave-core contracts.
  </desc>

  <rect width="1200" height="400" rx="24" fill="#10162f"/>

  <g id="identity" transform="translate(56 54)">
    <text x="0" y="0" fill="#18b6d9"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="700" letter-spacing="2">PYTHON AUTHENTICATION STACK · V7</text>
    <text x="0" y="82" fill="#ffffff"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="68" font-weight="750" letter-spacing="-2">litestar-auth</text>
    <text x="0" y="132" fill="#b9c1da"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25">Human sessions and workload identity.</text>
    <text x="0" y="166" fill="#b9c1da"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25">Separate trust paths. One typed core.</text>

    <g transform="translate(0 220)">
      <path d="M0 0H472" stroke="#3346d3" stroke-width="2"/>
      <text x="0" y="34" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20">opaque cookies</text>
      <text x="176" y="34" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20">mTLS</text>
      <text x="260" y="34" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20">bound JWT</text>
    </g>
  </g>

  <g id="trust-paths" transform="translate(630 42)">
    <rect x="0" y="0" width="514" height="316" rx="18" fill="#151e40" stroke="#3346d3"/>

    <g id="human-path" transform="translate(28 30)">
      <circle cx="10" cy="12" r="7" fill="#18b6d9"/>
      <text x="30" y="19" fill="#ffffff"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="23" font-weight="700">HUMAN</text>
      <path d="M122 12H174" stroke="#18b6d9" stroke-width="3"/>
      <path d="M166 5L175 12 166 19" fill="none" stroke="#18b6d9" stroke-width="3"/>
      <rect x="190" y="-8" width="252" height="42" rx="8" fill="#10162f" stroke="#18b6d9"/>
      <text x="208" y="20" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="20">litestar-auth · session</text>
    </g>

    <g id="machine-path" transform="translate(28 112)">
      <rect x="3" y="5" width="14" height="14" rx="2" fill="#f5a524"/>
      <text x="30" y="20" fill="#ffffff"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="23" font-weight="700">MACHINE</text>
      <path d="M150 12H174" stroke="#f5a524" stroke-width="3"/>
      <path d="M166 5L175 12 166 19" fill="none" stroke="#f5a524" stroke-width="3"/>
      <rect x="190" y="-8" width="252" height="42" rx="8" fill="#10162f" stroke="#f5a524"/>
      <text x="202" y="20" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="19">authweave-workload</text>
    </g>

    <path d="M218 162V207" stroke="#7782a8" stroke-width="2"/>
    <path d="M408 162V207" stroke="#7782a8" stroke-width="2"/>
    <path d="M218 207H408" stroke="#7782a8" stroke-width="2"/>
    <path d="M313 207V224" stroke="#7782a8" stroke-width="2"/>
    <path d="M306 216L313 225 320 216" fill="none" stroke="#7782a8" stroke-width="2"/>

    <g id="core" transform="translate(58 238)">
      <rect x="0" y="0" width="398" height="50" rx="10" fill="#3346d3"/>
      <text x="24" y="32" fill="#ffffff"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="21" font-weight="700">authweave-core · fail closed</text>
    </g>
  </g>

  <g id="shield" transform="translate(1120 350)">
    <path d="M0-17 18-10V5C18 20 9 29 0 33-9 29-18 20-18 5V-10Z"
          fill="none" stroke="#18b6d9" stroke-width="3"/>
    <circle cx="0" cy="2" r="5" fill="#f5a524"/>
    <path d="M0 7V17" stroke="#f5a524" stroke-width="4"/>
  </g>
</svg>
