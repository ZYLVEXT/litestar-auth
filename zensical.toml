[project]
site_name = "litestar-auth 7"
site_description = "Typed human and workload authentication for Python"
site_url = "https://zylvext.github.io/litestar-auth/"
site_author = "Vladislav Shepilov"
copyright = "Copyright &copy; 2026 Vladislav Shepilov"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "install.md" },
  { "Quickstart" = "quickstart.md" },
  { "Architecture" = "architecture.md" },
  { "Security" = "security.md" },
  { "Deployment" = "deployment.md" },
  { "Migration 6.x → 7" = "migration.md" },
  { "Roadmap" = "roadmap.md" },
  { "Releasing" = "releasing.md" },
  { "Merchant webhooks" = "merchant/webhooks.md" },
  { "Webhook sender threat model" = "merchant/webhook-sender-threat-model.md" },
  { "Merchant DPoP" = "merchant/dpop.md" },
  { "DPoP deployment profiles" = "merchant/dpop-deployment-profiles.md" },
  { "Merchant SPIFFE" = "merchant/spiffe.md" },
  { "Merchant introspection" = "merchant/introspection.md" },
  { "Merchant token exchange" = "merchant/token-exchange.md" },
  { "Payment HTTP signatures" = "merchant/http-signatures.md" },
  { "Payment authorization details" = "merchant/authorization-details.md" },
  { "Payment authorization schema v1" = "schemas/payment-authorization-v1.md" },
  { "Contributing" = "contributing.md" },
]

[project.repository]
name = "litestar-auth"
url = "https://github.com/ZYLVEXT/litestar-auth"
edit_uri = "edit/main/docs/"

[project.theme]
variant = "classic"
language = "en"
logo = "assets/litestar-auth-mark.svg"
favicon = "assets/litestar-auth-mark.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
